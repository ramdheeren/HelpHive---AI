<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Hive Login</title>
    <style>
        :root {
            --lime: #92c83e;
            --lime-dark: #709d27;
            --black: #090909;
            --white: #ffffff;
            --muted: #b9b9b9;
            --panel: #151515;
            --border: #3b3b3b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            min-width: 0;
            min-height: 100vh;
            margin: 0;
            padding: clamp(1.5rem, 5vw, 4rem) 1rem;
            background: var(--black);
            color: var(--white);
            font-family: "Raleway", sans-serif;
        }

        .login-shell {
            width: min(100%, 32rem);
            margin: 0 auto;
        }

        .brand {
            margin: 0 0 0.5rem;
            color: var(--lime);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            letter-spacing: 0.08em;
            text-align: center;
        }

        .intro {
            margin: 0 0 2rem;
            color: var(--muted);
            text-align: center;
        }

        .login-panel {
            padding: clamp(1.25rem, 4vw, 3rem);
            border: 1px solid var(--border);
            border-top: 4px solid var(--lime);
            background: var(--panel);
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.3);
        }

        .login-panel h2 {
            margin-top: 0;
        }

        .error-message {
            margin: 0 0 1.5rem;
            padding: 0.9rem 1rem;
            border-left: 4px solid var(--lime);
            background: rgba(146, 200, 62, 0.12);
            color: var(--white);
        }

        form {
            display: grid;
            gap: 1.25rem;
        }

        .field {
            display: grid;
            gap: 0.45rem;
        }

        label {
            color: var(--white);
            font-size: 0.95rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 2.8rem;
            padding: 0.75rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            background: #0d0d0d;
            color: var(--white);
            font: inherit;
        }

        input:focus {
            border-color: var(--lime);
            outline: 2px solid rgba(146, 200, 62, 0.25);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding-top: 0.5rem;
        }

        button,
        .home-link,
        .signup-link {
            display: inline-block;
            min-height: 2.8rem;
            padding: 0.8rem 1.25rem;
            border-radius: 0.35rem;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            border: 1px solid var(--lime);
            background: var(--lime);
            color: var(--black);
        }

        button:hover {
            background: var(--lime-dark);
            border-color: var(--lime-dark);
        }

        .home-link,
        .signup-link {
            color: var(--white);
        }

        .home-link:hover,
        .signup-link:hover {
            color: var(--lime);
        }

        .signup-link {
            display: block;
            margin-top: 1.5rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .actions > * {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <h1 class="brand">HELP HIVE</h1>
        <p class="intro">Welcome back. Sign in to continue helping your community.</p>

        <section class="login-panel" aria-labelledby="login-title">
            <h2 id="login-title">Log In</h2>
            {% if error_message %}
                <p class="error-message" role="alert">{{ error_message }}</p>
            {% endif %}
            <form method="POST" action="/login/">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="{{ email or '' }}" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required>
                </div>
                <div class="actions">
                    <button type="submit">Log In</button>
                    <a class="home-link" href="{{ url_for('views.home') }}">Back to Help Hive</a>
                </div>
            </form>
            <a class="signup-link" href="{{ url_for('auth.signup') }}">Create an account</a>
        </section>
    </main>
</body>
</html>
